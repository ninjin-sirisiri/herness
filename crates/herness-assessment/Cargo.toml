[package]
name = "herness-assessment"
description = "Tool-less assessment transport, normal-LLM condition adapter, deadline/cancellation control, and sanitized errors for H2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
herness-core = { path = "../herness-core" }
herness-supervision = { path = "../herness-supervision" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid.workspace = true
