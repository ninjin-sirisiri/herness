<article class="decision-article">
<h1 id="queue-choice">Queue choice</h1>
<p id="summary">Use <code id="fifo">FIFO</code> with a 750 ms window and at most 2 MiB.</p>
<p id="decision">Do not use <code id="lifo">LIFO</code> unless the owner approves a migration.</p>
<p id="adopt">Adopt the queue. See <a id="plan-link" href="../plans/2026-11-01-example.md">the plan</a>.</p>
</article>
