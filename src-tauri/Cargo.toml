[package]
name = "herness-desktop"
description = "Desktop host adapters and the Tauri shell for herness. Task 7 registers the macOS Keychain credential adapter as a library; Task 11 adds the Tauri binary, IPC boundary, and minimal trusted UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "herness_desktop"

[[bin]]
name = "herness-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
herness-core = { path = "../crates/herness-core" }
herness-assessment = { path = "../crates/herness-assessment" }
herness-engine-pi = { path = "../crates/herness-engine-pi" }
herness-html-sync = { path = "../crates/herness-html-sync" }
herness-store = { path = "../crates/herness-store" }
herness-supervision = { path = "../crates/herness-supervision" }
notify = "=8.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
uuid.workspace = true
tauri = { version = "2.12.5", default-features = true }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSHTTPCookie",
    "NSObject",
    "NSSet",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKContentWorld",
    "WKFrameInfo",
    "WKHTTPCookieStore",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKNavigationResponse",
    "WKPreferences",
    "WKProcessPool",
    "WKSnapshotConfiguration",
    "WKUIDelegate",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKWebpagePreferences",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataRecord",
    "WKWebsiteDataStore",
    "WKWindowFeatures",
] }
security-framework = "3.7.0"
security-framework-sys = "2.17.0"

[dev-dependencies]
tempfile.workspace = true
